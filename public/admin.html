<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Glow Studio admin</title>
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#0d0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500..600&display=swap" rel="stylesheet">
<style>
  /* Golden Hour, the same gold-on-black look as the app. */
  :root { color-scheme: dark;
    --bg: #0d0d10; --card: #18181c; --card-2: #232328; --text: #f7f3ea; --muted: #a9a59c; --line: #2e2e34;
    --rose: #f3c062; --blush: rgb(243 192 98 / 0.14); --gold: linear-gradient(135deg, #ffe3a3, #f3b54a); --on-gold: #1a1206;
    --good: #9fd8b0; --warn: #f3b54a; --bad: #ffa3a3; --ink: #f7f3ea;
    --good-bg: rgb(159 216 176 / 0.14); --bad-bg: rgb(255 163 163 / 0.14); --dirty: rgb(243 192 98 / 0.08);
    --font: Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --display: Fraunces, Georgia, serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 12px 16px; padding: 14px 20px 0; border-bottom: 1px solid var(--line);
    background: rgb(13 13 16 / 0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1, .brand { font: 600 21px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
  .brand em, header h1 em { font-style: normal; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head-actions { display: flex; gap: 8px; margin-left: auto; }
  nav { order: 3; flex-basis: 100%; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px 10px; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 0; background: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  nav button:hover { color: var(--text); }
  nav button[aria-current="page"] { background: var(--blush); color: var(--rose); }
  .spacer { display: none; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .tile b { display: block; font-size: 26px; line-height: 1.2; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 13px; }
  .tile.alert { border-color: var(--bad); }
  .tile.alert b { color: var(--bad); }
  section.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 20px; overflow-x: auto; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--rose); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--card-2); color: var(--text); }
  .pill.pro { background: var(--gold); color: var(--on-gold); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.good { background: var(--good-bg); color: var(--good); }
  button.btn, a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; border: 0; border-radius: 999px; padding: 8px 18px;
    background: var(--gold); color: var(--on-gold); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
    box-shadow: 0 6px 20px -8px rgb(243 181 74 / 0.6); }
  button.btn:active { transform: scale(0.97); }
  button.btn.ghost { background: none; color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  button.btn.ghost:hover { border-color: var(--muted); }
  button.btn.danger { background: var(--bad-bg); color: var(--bad); box-shadow: none; }
  header button.btn { min-height: 34px; padding: 6px 14px; font-size: 14px; }
  button.link { border: 0; background: none; color: var(--rose); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  input, select, textarea { font: inherit; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--rose); outline-offset: 1px; border-color: transparent; }
  input::placeholder { color: var(--muted); }
  input[type=checkbox] { min-height: 0; width: 20px; height: 20px; margin: 0; padding: 0; accent-color: #f3b54a; flex: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 800px) {
    .grid2 { grid-template-columns: minmax(0, 1fr); gap: 0; } main { padding: 16px; }
    header { padding: 10px 16px 0; } nav { margin: 0 -16px; padding: 2px 16px 8px; }
    section.card { padding: 16px; border-radius: 18px; margin-bottom: 16px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tile b { font-size: 22px; }
    .row input:not([type=checkbox]) { flex: 1 1 140px; min-width: 0 !important; }
  }
  td:first-child { white-space: nowrap; }
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  #login[hidden] { display: none; }
  .login-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; }
  .login-mark { width: 52px; height: 52px; border-radius: 14px; display: block; margin-bottom: 18px; }
  .login-card h1 { font: 600 28px/1.15 var(--display); margin: 0 0 8px; }
  .login-card p { margin: 0 0 20px; }
  .login-card input[type=password] { width: 100%; min-height: 48px; font-size: 16px; }
  .check { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; color: var(--muted); cursor: pointer; }
  .login-card .btn { width: 100%; min-height: 48px; font-size: 16px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); font-weight: 600; padding: 10px 18px; border-radius: 14px; display: none; z-index: 5; max-width: 90vw; }
  #toast.bad { background: var(--bad); color: #2a0b0b; }
  .msg { white-space: pre-wrap; word-break: break-word; max-width: 520px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { font-size: 11px; fill: var(--muted); }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .links a { margin-right: 14px; color: var(--rose); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  table.feat { table-layout: fixed; }
  .feat td { vertical-align: middle; }
  .feat td:nth-child(1) { width: 30%; } .feat td:nth-child(2) { width: 38%; } .feat td:nth-child(4) { width: 90px; text-align: right; }
  button.btn:disabled { opacity: 0.3; cursor: default; }
  @media (max-width: 800px) {
    table.feat, .feat tbody, .feat tr, .feat td { display: block; width: auto !important; text-align: left !important; }
    .feat tr { padding: 10px 0; border-bottom: 1px solid var(--line); } .feat td { border: 0; padding: 3px 0; }
  }
  .feat td:first-child { white-space: normal; min-width: 180px; }
  .feat .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .feat .seg button { border: 0; background: none; font: inherit; font-size: 13px; padding: 6px 11px; cursor: pointer; color: var(--muted); }
  .feat .seg button + button { border-left: 1px solid var(--line); }
  .feat .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .feat .seg button[data-s="off"][aria-pressed="true"] { background: var(--bad); color: #2a0b0b; }
  .feat .seg button[data-s="on"][aria-pressed="true"] { background: var(--good); color: #0b2414; }
  .feat .seg button[data-s="testers"][aria-pressed="true"], .feat .seg button[data-s="rollout"][aria-pressed="true"] { background: var(--warn); color: var(--on-gold); }
  .feat input[type=number] { width: 70px; min-height: 32px; padding: 4px 6px; }
  .feat .lim { font-size: 13px; }
  .feat .lim label { margin-right: 8px; white-space: nowrap; }
  .feat tr.dirty { background: var(--dirty); }
  .steps { margin: 0; padding-left: 20px; }
  .steps li { margin-bottom: 4px; }
  .actions-help { margin: -4px 0 14px; font-size: 13px; }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="login-card">
    <img class="login-mark" src="/icon-192.png" alt="">
    <h1>Glow Studio <em style="font-style:normal;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent">admin</em></h1>
    <p class="muted">Enter your admin key. It's the ADMIN_KEY secret in Supabase.</p>
    <form id="loginForm">
      <input id="keyInput" type="password" autocomplete="current-password" placeholder="Admin key" aria-label="Admin key" required>
      <label class="check"><input type="checkbox" id="remember"> Remember on this device</label>
      <button class="btn" type="submit">Open</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>Glow Studio <em>admin</em></h1>
    <nav id="tabs">
      <button data-tab="overview" aria-current="page">Overview</button>
      <button data-tab="features">Features</button>
      <button data-tab="users">Users</button>
      <button data-tab="subs">Subscriptions</button>
      <button data-tab="support">Support</button>
      <button data-tab="errors">App errors</button>
      <button data-tab="abuse">Blocking</button>
      <button data-tab="log">Change log</button>
    </nav>
    <div class="head-actions">
      <button class="btn ghost" id="refresh">Refresh</button>
      <button class="btn ghost" id="logout">Sign out</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status"></div>

<script src="/features.js"></script>
<script>
const API = "https://vahtdouihsnpnaskrtka.supabase.co/functions/v1/admin";
const APIKEY = "sb_publishable_UH4edWInYXUknGg_Piqkeg_8fvxPL0b";
const $ = (id) => document.getElementById(id);
let key = sessionStorage.getItem("glowAdminKey") || localStorage.getItem("glowAdminKey") || "";
let tab = location.hash.slice(1) || "overview";

// Builds elements without ever treating data as HTML (support messages come from the public).
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const money = (n) => (Number(n) < 0 ? "−$" : "$") + Math.abs(Number(n || 0)).toFixed(Math.abs(Number(n)) < 10 ? 2 : 0);
const when = (t) => (t ? new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "");
const short = (id) => (id ? String(id).slice(0, 8) : "");
function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 3500);
}

async function api(action, args = {}) {
  const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", apikey: APIKEY, "x-admin-key": key },
    body: JSON.stringify({ action, ...args }) });
  const data = await res.json().catch(() => ({ error: `Error ${res.status}` }));
  if (res.status === 401) { signOut(); throw new Error(data.error || "Wrong admin key."); }
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function signOut() { key = ""; sessionStorage.removeItem("glowAdminKey"); localStorage.removeItem("glowAdminKey"); $("app").hidden = true; $("login").hidden = false; }
$("logout").onclick = signOut;
$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  key = $("keyInput").value.trim();
  try {
    await api("audit");
    (($("remember").checked) ? localStorage : sessionStorage).setItem("glowAdminKey", key);
    start();
  } catch (err) { toast(err.message, true); }
};
$("tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.tab); };
$("refresh").onclick = () => show(tab);

function start() { $("login").hidden = true; $("app").hidden = false; show(tab); }
async function show(name) {
  tab = name; history.replaceState(null, "", "#" + name);
  for (const b of $("tabs").children) {
    if (b.dataset.tab === name.split("/")[0]) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  const view = $("view"); view.replaceChildren(h("p", { class: "muted" }, "Loading…"));
  try { view.replaceChildren(...[].concat(await VIEWS[name.split("/")[0]](name.split("/")[1]))); }
  catch (err) { view.replaceChildren(h("section", { class: "card" }, h("h2", {}, "Couldn't load this"), h("p", {}, err.message))); }
}

function table(cols, rows, empty = "Nothing here yet.") {
  if (!rows.length) return h("p", { class: "muted" }, empty);
  return h("table", {}, h("thead", {}, h("tr", {}, cols.map((c) => h("th", { class: c.n ? "n" : null }, c.t)))),
    h("tbody", {}, rows.map((r) => h("tr", {}, cols.map((c) => h("td", { class: (c.n ? "n " : "") + (c.cls || "") }, c.f(r)))))));
}
const userLink = (id) => h("button", { class: "link mono", onclick: () => show("users/" + id), title: id }, short(id));
const planPill = (plan, period) => h("span", { class: "pill " + (plan === "pro" ? "pro" : "") }, plan === "pro" ? `Pro${period ? " " + period : ""}` : "Free");

// Bars: AI cost per day (rose) and AI runs (grey) on their own scales.
function chart(daily) {
  const days = [...daily].reverse(), W = 760, H = 180, pad = 28, bw = (W - pad * 2) / days.length;
  const maxC = Math.max(0.01, ...days.map((d) => Number(d.ai_cost))), maxR = Math.max(1, ...days.map((d) => d.ai_runs));
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H + 24}`);
  let s = `<line x1="${pad}" y1="${H}" x2="${W - pad}" y2="${H}" stroke="#2e2e34"/>`;
  days.forEach((d, i) => {
    const x = pad + i * bw, hr = (d.ai_runs / maxR) * (H - 20), hc = (Number(d.ai_cost) / maxC) * (H - 20);
    s += `<rect x="${x + bw * 0.12}" y="${H - hr}" width="${bw * 0.36}" height="${hr}" rx="2" fill="#5a5850"><title>${d.day}: ${d.ai_runs} AI runs</title></rect>`;
    s += `<rect x="${x + bw * 0.52}" y="${H - hc}" width="${bw * 0.36}" height="${hc}" rx="2" fill="#f3c062"><title>${d.day}: ${money(d.ai_cost)} est. AI cost</title></rect>`;
    if (i % Math.ceil(days.length / 10) === 0 || i === days.length - 1) s += `<text x="${x + bw / 2}" y="${H + 16}" text-anchor="middle">${d.day.slice(5)}</text>`;
  });
  s += `<text x="${pad}" y="12">max ${maxR} runs · ${money(maxC)}</text>`;
  svg.innerHTML = s;
  return h("div", { class: "chart" }, svg, h("div", { class: "legend" }, h("span", {}, h("i", { style: "background:#5a5850" }), "AI runs"), h("span", {}, h("i", { style: "background:#f3c062" }), "Estimated AI cost")));
}

// Plain names for the events the app reports (anything not listed shows its raw name).
const EVENT_NAMES = {
  app_open: "Opened Glow Studio", tab: "Switched tab", photo_open: "Opened a photo", sample_open: "Tried a sample photo",
  edit: "Used an editor tool", ai_start: "Started an AI edit", ai_done: "AI edit finished", ai_fail: "AI edit failed",
  enhance_to_editor: "Enhance → Editor", batch_open: "Picked photos for batch Enhance", batch_locked: "Tapped batch Enhance (free plan)",
  batch_start: "Started a batch Enhance", batch_done: "Batch Enhance finished", batch_save: "Saved a batch", save: "Saved a photo", share: "Shared a photo", share_card: "Opened share card",
  capture: "Took a camera photo", look: "Picked a camera look", camera: "Camera state", restore: "Restored last edit",
  paywall_view: "Saw Glow Studio Pro", purchase_start: "Tapped buy", purchase: "Bought Glow Studio Pro", purchase_fail: "Purchase failed",
  packs_view: "Saw credit packs", pack_start: "Tapped a credit pack", pack_purchase: "Bought a credit pack", pack_fail: "Credit pack purchase failed",
  ad_watched: "Watched an ad", setting: "Changed a setting", support_sent: "Sent a support message", error_shown: "Saw an error message",
};
const SUB_NAMES = {
  INITIAL_PURCHASE: "New subscription", RENEWAL: "Renewal", CANCELLATION: "Cancelled (or refunded)", UNCANCELLATION: "Turned renewal back on",
  EXPIRATION: "Ended", BILLING_ISSUE: "Payment problem", PRODUCT_CHANGE: "Changed plan", TRANSFER: "Moved to another account",
  SUBSCRIPTION_PAUSED: "Paused", SUBSCRIPTION_EXTENDED: "Extended", TEMPORARY_ENTITLEMENT_GRANT: "Temporary access", TEST: "Test event",
  NON_RENEWING_PURCHASE: "Credit pack", REFUND_REVERSED: "Refund reversed",
};
// glow_pro_yearly → yearly, glow_credits_30 → 30 credits.
const planName = (id) => (id || "").replace(/^glow_pro_/, "").replace(/^glow_credits_(\d+).*/, "$1 credits");
const subRow = (r) => [
  SUB_NAMES[r.type] || r.type,
  r.period_type === "TRIAL" ? h("span", { class: "pill", style: "margin-left:6px" }, "trial") : "",
  r.environment === "SANDBOX" ? h("span", { class: "pill", style: "margin-left:6px" }, "test") : "",
];

const VIEWS = {
  // Feature switches (migration 013). The list itself comes from features.js, the same file the app
  // uses, so every switch the app knows about is here, with its built-in default.
  async features() {
    const d = await api("features");
    const rows = Object.fromEntries(d.flags.map((r) => [r.key, r]));
    const health = Object.fromEntries((d.quality || []).map((q) => ["tool:" + q.mode, q]));
    const testers = d.testers || [];
    const STATES = [["default", "Default"], ["off", "Off"], ["testers", "Testers"], ["rollout", "Rollout"], ["on", "On"]];
    const describe = (r, def) => !r ? `Built-in default: ${def ? "on" : "off"}` : r.status === "rollout" ? `Testers + ${r.percent}% of everyone` : r.status === "testers" ? "Testers only" : r.status === "on" ? "Everyone" : "Nobody";
    const search = h("input", { type: "search", placeholder: "Find a feature", "aria-label": "Find a feature", style: "min-width:220px",
      oninput: () => { const q = search.value.trim().toLowerCase(); document.querySelectorAll(".feat tbody tr").forEach((tr) => { tr.hidden = !!q && !tr.dataset.find.includes(q); }); } });

    function row(key, label, def, note) {
      const r = rows[key];
      const st = { status: r ? r.status : "default", percent: r && r.status === "rollout" ? r.percent : 10,
        platforms: r && r.platforms ? [...r.platforms] : [], min_build: r && r.min_build ? r.min_build : "", note: r && r.note ? r.note : "" };
      const tr = h("tr", { "data-find": `${key} ${label}`.toLowerCase() });
      const seg = h("span", { class: "seg", role: "group", "aria-label": `${label} switch` });
      const pct = h("input", { type: "number", min: "1", max: "99", value: String(st.percent), "aria-label": `${label} rollout percent`, oninput: () => { st.percent = Number(pct.value); dirty(); } });
      const pctWrap = h("span", { class: "lim" }, " ", pct, "%");
      const plats = ["web", "ios", "android"].map((p) => { const c = h("input", { type: "checkbox", checked: st.platforms.includes(p) || null, onchange: () => { st.platforms = plats.filter((x) => x.c.checked).map((x) => x.p); dirty(); } }); return { p, c }; });
      const build = h("input", { type: "number", min: "1", placeholder: "any", value: String(st.min_build), "aria-label": `${label} minimum build`, style: "width:110px", oninput: () => { st.min_build = build.value; dirty(); } });
      const lim = h("div", { class: "lim muted" }, "Only on: ", plats.map(({ p, c }) => h("label", {}, c, " ", p)), " (none ticked = all) · min build ", build);
      const save = h("button", { class: "btn", disabled: true, onclick: () => commit() }, "Save");
      const status = h("div", { class: "muted lim" }, describe(r, def), r ? ` · ${when(r.updated_at)}` : "");
      function paint() {
        for (const b of seg.children) b.setAttribute("aria-pressed", String(b.dataset.s === st.status));
        pctWrap.hidden = st.status !== "rollout"; lim.hidden = st.status === "default" || st.status === "off";
      }
      function dirty() { tr.classList.add("dirty"); save.disabled = false; }
      STATES.forEach(([s, name]) => seg.append(h("button", { "data-s": s, onclick: () => { st.status = s; paint(); dirty(); } }, name)));
      async function commit() {

          a.plan === "pro" ? h("button", { class: "btn ghost", onclick: () => { if (confirm("Remove Pro from this account now? A real store subscription will set it back on its next renewal.")) act("setPro", { days: 0, reason: reason() || "" }, () => "Pro removed."); } }, "Remove Pro") : null),
        h("div", { class: "row" }, d.tester
          ? h("button", { class: "btn ghost", onclick: () => { if (confirm("Remove this account from the testers? It stops seeing features set to Testers.")) act("removeTester", {}, () => "Removed from testers."); } }, "Remove tester")
          : h("button", { class: "btn ghost", onclick: () => { const l = prompt("Make this account a tester (sees features set to Testers or Rollout). Name, e.g. My Android:", ""); if (l !== null) act("addTester", { label: l }, () => "Added as a tester."); } }, "Make tester")),
        h("div", { class: "row" }, p.blocked_at
          ? h("button", { class: "btn ghost", onclick: () => act("block", { blocked: false }, () => "Unblocked.") }, "Unblock AI tools")
          : h("button", { class: "btn danger", onclick: () => { const r = reason(); if (r !== null) act("block", { blocked: true, reason: r }, () => "Blocked from AI tools."); } }, "Block AI tools")),
        h("p", { class: "muted" }, "Money refunds: Apple decides iPhone refunds (customers ask at reportaproblem.apple.com). Google Play purchases can be refunded from the customer's page in RevenueCat."),
      ),
    ),
    h("section", { class: "card" }, h("h2", {}, "AI runs (newest 50)"), table([
      { t: "When", f: (r) => when(r.created_at) }, { t: "Tool", f: (r) => r.mode }, { t: "Credits", n: 1, f: (r) => r.cost + (r.from_bonus ? " bonus" : "") },
      { t: "Status", f: (r) => [
        r.status === "succeeded" ? h("span", { class: "pill good" }, "Worked") : r.status === "failed" || r.status === "canceled" ? h("span", { class: "pill bad" }, "Failed") : "",
        r.refunded ? h("span", { class: "pill" }, " Refunded") : !r.status ? (r.prediction_id ? "Charged" : h("span", { class: "muted" }, "Not started")) : "",
        r.status === "succeeded" && r.finished_at ? h("span", { class: "muted" }, ` ${Math.round((new Date(r.finished_at) - new Date(r.created_at)) / 1000)}s`) : "",
        r.error ? h("div", { class: "muted msg" }, r.error) : "",
      ] },
      { t: "IP", cls: "mono", f: (r) => (r.ip ? h("span", {}, r.ip, " ", h("button", { class: "link", onclick: async () => { const why = prompt(`Block ${r.ip} from AI tools on every account? Reason:`, ""); if (why === null) return; await api("blockIp", { ip: r.ip, reason: why }).then(() => toast("Address blocked."), (e) => toast(e.message, true)); } }, "block")) : "") },
      { t: "", f: (r) => (r.refunded ? "" : h("button", { class: "btn ghost", onclick: () => { const why = reason(); if (why !== null) act("refund", { usage: r.id, reason: why }, () => "Credits returned."); } }, "Refund credits")) },
    ], d.usage, "No AI runs.")),
    h("section", { class: "card" }, h("h2", {}, "Subscription history"), table([
      { t: "When", f: (r) => when(r.created_at) }, { t: "Event", f: subRow },
      { t: "Plan", f: (r) => planName(r.product_id) }, { t: "Amount", n: 1, f: (r) => (r.price_usd != null ? money(r.price_usd) : "") },
      { t: "Reason", cls: "muted", f: (r) => (r.cancel_reason || "").replace(/_/g, " ").toLowerCase() },
    ], d.subscriptions || [], "No purchases.")),
    h("div", { class: "grid2" },
      h("section", { class: "card" }, h("h2", {}, "Support messages"), table([
        { t: "When", f: (r) => when(r.created_at) }, { t: "Topic", f: (r) => r.topic }, { t: "Message", f: (r) => h("div", { class: "msg" }, r.message) }, { t: "Status", f: (r) => r.status },
      ], d.support, "None.")),
      h("section", { class: "card" }, h("h2", {}, "Recent app activity"), table([
        { t: "When", f: (r) => when(r.created_at) }, { t: "Event", f: (r) => EVENT_NAMES[r.name] || r.name }, { t: "Details", cls: "muted", f: (r) => Object.entries(r.props || {}).map(([k, v]) => `${k}: ${v}`).join(", ") },
      ], [...d.errors.map((e) => ({ created_at: e.created_at, name: "error", props: { message: e.message } })), ...d.events].sort((x, y) => (x.created_at < y.created_at ? 1 : -1)).slice(0, 40), "None.")),
    ),
  ];
}

if (key) start(); else $("login").hidden = false;
</script>
</body>
</html>
