# One-off (approved by the owner on 2026-10-30): remakes the sample's Enhance and Retouch previews
# with the new models through the live enhance function. Remove once done.
name: Sample refresh
on:
  push:
    branches: [sample-refresh]
    paths: [.github/workflows/sample-refresh.yml, tools/demo/refresh/refresh.py]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/demo/refresh/refresh.py
        env:
          MODES: retouch
      - run: |
          git config user.name "glow-demo-previews"
          git config user.email "actions@users.noreply.github.com"
          git add public/samples/demo-v2
          git commit -m "Sample: previews remade ($MODES)"
          git push origin HEAD:sample-refresh
