# One-off (2026-11-03): Try on outfit photos against the live server as a fresh anonymous user.
# Remove once done.
name: Try on outfit photos
on:
  push:
    branches: [claude/project-thread-duxqqh]
    paths: [tools/tryon-thumbs/trigger.txt]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pillow
      - run: python tools/tryon-thumbs/run.py
      - name: Commit
        if: always()
        run: |
          git config user.name "glow-tryon-test"
          git config user.email "actions@users.noreply.github.com"
          git add tools/tryon-thumbs
          git commit -m "Try on outfit photos results" || echo "nothing to commit"
          git pull --rebase origin claude/project-thread-duxqqh && git push origin HEAD:claude/project-thread-duxqqh
