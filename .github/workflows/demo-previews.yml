# One-off: makes the prepared "Try a sample" previews with tools/demo/generate.ts and commits
# them to this branch. Replicate is reached through a temporary Supabase function that checks
# this workflow's GitHub OIDC token, so there is no shared secret and the Replicate token never
# leaves Supabase. Remove this workflow once the previews are in.
name: Demo previews
on:
  push:
    branches: [demo-gen]
    paths: [.github/workflows/demo-previews.yml]
permissions:
  contents: write
  id-token: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install pillow
      - name: Generate
        env:
          REPLICATE_API_BASE: https://vahtdouihsnpnaskrtka.supabase.co/functions/v1/demo-gen
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          REPLICATE_API_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=glow-demo-gen" | jq -r .value)
          export REPLICATE_API_TOKEN
          deno run --node-modules-dir=none --allow-env --allow-net --allow-read --allow-write tools/demo/generate.ts
      - name: Fit to the original
        run: python3 tools/demo/optimize.py
      - name: Commit
        run: |
          git config user.name "glow-demo-previews"
          git config user.email "actions@users.noreply.github.com"
          git add public/samples/demo
          git commit -m "Prepared sample previews from Glow's AI pipeline" || echo "nothing to commit"
          git push origin HEAD:demo-gen
