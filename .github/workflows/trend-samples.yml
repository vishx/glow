# One-off (owner asked 2026-11-02): sample pictures for the trend cards. Replicate is reached through
# the temporary Supabase function "trend-samples", which checks this workflow's GitHub OIDC token.
# Remove once done.
name: Trend samples
on:
  push:
    branches: [claude/project-thread-eunn7r]
    paths: [tools/trend-samples/trigger.txt]
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pip install pillow
      - name: Make the samples
        env:
          REPLICATE_API_BASE: https://vahtdouihsnpnaskrtka.supabase.co/functions/v1/trend-samples
        run: |
          # A fresh OIDC token for each sample (they're short-lived).
          MODES=$(sed -n 2p tools/trend-samples/trigger.txt); MODES=${MODES:-"trend_figurine trend_yearbook trend_poster trend_polaroid trend_snow trend_holiday"}
          for m in $MODES; do
            REPLICATE_API_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=glow-trend-samples" | jq -r .value)
            export REPLICATE_API_TOKEN
            deno run --allow-env --allow-net --allow-read --allow-write tools/trend-samples/run.ts $m || echo "$m failed"
          done
          python tools/trend-samples/shrink.py
      - name: Commit
        if: always()
        run: |
          git config user.name "glow-trend-samples"
          git config user.email "actions@users.noreply.github.com"
          git add tools/trend-samples/out public/samples/trends
          git commit -m "Trend sample pictures" || echo "nothing to commit"
          git pull --rebase origin claude/project-thread-eunn7r && git push origin HEAD:claude/project-thread-eunn7r
