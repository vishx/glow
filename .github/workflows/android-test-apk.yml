# Builds a sideloadable debug APK of the Glow Capacitor app for testing on a phone.
# Runs on GitHub's runners because they ship the Android SDK.
name: Android test APK

on:
  push:
    branches: [claude/project-thread-9esvz0]
    paths: [.github/workflows/android-test-apk.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of the app to build
        default: redesign/camera-editor

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_REF: ${{ github.event.inputs.ref || 'redesign/camera-editor' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_REF }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Android SDK packages (the runner ships the SDK itself)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          bash build-web.sh
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        id: apk
        run: |
          SHA=$(git rev-parse --short HEAD)
          NAME="glow-test-${SHA}.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ls -l "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: glow-test-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-test-${{ steps.apk.outputs.sha }}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease \
            --title "Glow Android test build (${{ steps.apk.outputs.sha }})" \
            --notes "Debug build of ${APP_REF} for sideloading. Not for the Play Store."

      - name: Keep a copy on the apk-builds branch
        run: |
          NAME="${{ steps.apk.outputs.name }}"
          mkdir /tmp/out && cp "$NAME" /tmp/out/
          cd /tmp/out
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$NAME" && git commit -qm "Android test APK ${{ steps.apk.outputs.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
