# One-off (owner approved 2026-10-31): runs tools/sharp-test/run.py on the owner's photo and
# commits the results to this branch. Replicate is reached through the temporary Supabase
# function "sharp-test", which checks this workflow's GitHub OIDC token. Remove once done.
name: Sharpness test
on:
  push:
    branches: [claude/project-thread-mg0015]
    paths: [tools/sharp-test/trigger.txt]
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Run the test
        env:
          REPLICATE_API_BASE: https://vahtdouihsnpnaskrtka.supabase.co/functions/v1/sharp-test
        run: |
          python tools/sharp-test/run.py $(cat tools/sharp-test/trigger.txt | sed -n 2p)
      - name: Commit
        if: always()
        run: |
          git config user.name "glow-sharp-test"
          git config user.email "actions@users.noreply.github.com"
          git add tools/sharp-test/out
          git commit -m "Sharpness test results" || echo "nothing to commit"
          git pull --rebase origin claude/project-thread-mg0015 && git push origin HEAD:claude/project-thread-mg0015
