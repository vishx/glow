# One-off pro edit model test: runs tools/pro-edit-test/run.py and commits the results to this
# branch. Replicate is reached through the temporary Supabase function "pro-test", which checks
# this workflow's GitHub OIDC token. Remove once done.
name: Pro edit model test
on:
  push:
    branches: [claude/project-thread-logl9f]
    paths: [tools/pro-edit-test/trigger.txt]
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pillow numpy onnxruntime insightface==0.7.3
      - name: Run the test
        env:
          REPLICATE_API_BASE: https://vahtdouihsnpnaskrtka.supabase.co/functions/v1/pro-test
        run: python tools/pro-edit-test/run.py $(sed -n 2p tools/pro-edit-test/trigger.txt)
      - name: Commit
        if: always()
        run: |
          git config user.name "glow-pro-test"
          git config user.email "actions@users.noreply.github.com"
          git add tools/pro-edit-test/out
          git commit -m "Pro edit test results" || echo "nothing to commit"
          git pull --rebase origin claude/project-thread-logl9f && git push origin HEAD:claude/project-thread-logl9f
