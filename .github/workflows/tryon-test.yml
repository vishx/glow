# One-off Try on check (2026-10-31 audit): tools/tryon-test/run.py calls the enhance-tryon preview
# server as a fresh anonymous user and commits the AI results. Remove once done.
name: Try on test
on:
  push:
    branches: [claude/project-thread-gee5le]
    paths: [tools/tryon-test/trigger.txt]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pillow
      - run: python tools/tryon-test/run.py
      - name: Commit
        if: always()
        run: |
          git config user.name "glow-tryon-test"
          git config user.email "actions@users.noreply.github.com"
          git add tools/tryon-test/out
          git commit -m "Try on test results" || echo "nothing to commit"
          git pull --rebase origin claude/project-thread-gee5le && git push origin HEAD:claude/project-thread-gee5le
