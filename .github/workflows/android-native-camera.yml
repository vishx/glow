# Builds a sideloadable debug APK of the native camera prototype on every push to its branch.
# Runs on GitHub's runners because they ship the Android SDK.
name: Android native camera APK

on:
  push:
    branches: [claude/project-thread-bnuul9]
    paths: [mobile/**, public/**, .github/workflows/android-native-camera.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Android SDK packages (the runner ships the SDK itself)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          bash build-web.sh
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        id: apk
        run: |
          SHA=$(git rev-parse --short HEAD)
          NAME="glow-native-camera-${SHA}.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ls -l "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: glow-native-camera-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Keep a copy on the apk-native-camera branch
        run: |
          NAME="${{ steps.apk.outputs.name }}"
          mkdir /tmp/out && cp "$NAME" /tmp/out/
          cd /tmp/out
          git init -q -b apk-native-camera
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$NAME" && git commit -qm "Native camera APK ${{ steps.apk.outputs.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-native-camera
